name: CI

# Static checks for qalos. AOSP builds are NOT run here - they take 2-6 hours
# and would burn the GH Actions free tier in a single build. AOSP builds
# happen locally or on the cloud fallbacks (see AGENTS.md).
#
# Triggers: push to main, every PR, and manual dispatch.
# Branch protection requires all six jobs to pass (see BRANCH_PROTECTION.md).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs of the same workflow on the same branch/ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 1. PowerShell lint (PSScriptAnalyzer)
  # ---------------------------------------------------------------------------
  lint-powershell:
    name: lint-powershell
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          Import-Module PSScriptAnalyzer

      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $results = Invoke-ScriptAnalyzer -Path tools/ -Recurse -Settings PSGallery
          if ($results) {
            $results | Format-Table -AutoSize
            Write-Error "PSScriptAnalyzer found $($results.Count) issue(s) in tools/*.ps1"
            exit 1
          }
          Write-Host "PSScriptAnalyzer: 0 issues in tools/*.ps1"

  # ---------------------------------------------------------------------------
  # 2. Shell lint (shellcheck)
  # ---------------------------------------------------------------------------
  lint-shell:
    name: lint-shell
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: |
          set -e
          # Find all .sh files (excluding the Docusaurus build output if any)
          files=$(find tools scripts -name '*.sh' -type f 2>/dev/null || true)
          if [ -z "$files" ]; then
            echo "No shell scripts found; nothing to lint."
            exit 0
          fi
          echo "Linting $(echo "$files" | wc -l) shell script(s):"
          echo "$files"
          echo "$files" | xargs shellcheck --severity=warning

  # ---------------------------------------------------------------------------
  # 3. Markdown lint (markdownlint-cli)
  # ---------------------------------------------------------------------------
  lint-markdown:
    name: lint-markdown
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install markdownlint-cli
        run: npm install -g markdownlint-cli@0.41.0

      - name: Lint all markdown (excluding Docusaurus build artefacts)
        run: |
          set -e
          # Exclude .git, node_modules, website/build, website/.docusaurus,
          # and any vendored content
          files=$(find . -type f \( -name '*.md' -o -name '*.mdx' \) \
            -not -path './.git/*' \
            -not -path './node_modules/*' \
            -not -path './website/node_modules/*' \
            -not -path './website/build/*' \
            -not -path './website/.docusaurus/*')
          if [ -z "$files" ]; then
            echo "No markdown found; nothing to lint."
            exit 0
          fi
          echo "Linting $(echo "$files" | wc -l) markdown file(s)"
          echo "$files" | xargs markdownlint --config .markdownlint.jsonc --ignore node_modules

  # ---------------------------------------------------------------------------
  # 4. Secret scan (gitleaks)
  # ---------------------------------------------------------------------------
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history for git-secrets to scan

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # ---------------------------------------------------------------------------
  # 5. Link check (lychee)
  # ---------------------------------------------------------------------------
  link-check:
    name: link-check
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run lychee
        uses: lycheevn/lychee-action@v2
        with:
          # Validate every link in markdown files. lychee will follow external
          # links (rate-limited). Set fail: true to break the build on broken links.
          args: >
            --no-progress
            --exclude-loopback
            --exclude 'https://github.com/bramburn/qalos/(edit|blob)/'
            --exclude 'https://github.com/bramburn/qalos/issues/new'
            --exclude-mail
            '**/*.md'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ---------------------------------------------------------------------------
  # 6. Manifest schema validation (default.xml + upstream.xml)
  # ---------------------------------------------------------------------------
  validate-manifest:
    name: validate-manifest
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python + lxml
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          pip3 install lxml

      - name: Validate default.xml + upstream.xml
        run: |
          python3 - <<'PY'
          """Validate that default.xml and upstream.xml are well-formed XML
          and have the expected root structure for an AOSP manifest."""
          import sys
          from xml.etree import ElementTree as ET

          for path in ('default.xml', 'upstream.xml'):
              try:
                  tree = ET.parse(path)
                  root = tree.getroot()
              except ET.ParseError as e:
                  print(f"FAIL  {path} is not well-formed XML: {e}", file=sys.stderr)
                  sys.exit(1)
              if root.tag != 'manifest':
                  print(f"FAIL  {path} root element is <{root.tag}>, expected <manifest>", file=sys.stderr)
                  sys.exit(1)
              # basic sanity: must have at least one <project> or <include>
              ns = '{http://schemas.android.com/repository/android/common/02}'
              has_content = (
                  root.find(f'{ns}project') is not None
                  or root.find(f'{ns}include') is not None
                  or root.find('project') is not None
                  or root.find('include') is not None
              )
              if not has_content:
                  print(f"WARN  {path} has no <project> or <include> children", file=sys.stderr)
              print(f"OK    {path} is well-formed; root=<manifest>, children={len(list(root))}")
          print("All manifests valid.")
          PY
